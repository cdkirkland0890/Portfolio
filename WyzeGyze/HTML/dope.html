<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dope | Wyze Guyz Tattoo Parlor</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <header>
        <nav class="container nav">
            <a class="brand" href="../index.html">
                <img class="brand-logo" src="../assets/logo2.jpg" alt="">
                <strong>WYZE GUYZ</strong>
                <span>TATTOO PARLOR</span>
            </a>
        </nav>
    </header>

    <main>
        <section>
            <div class="container">
                <a class="button portfolio-back" href="../index.html#about">
                    Back to portfolios
                </a>
                <p class="eyebrow">Artist Portfolio</p>
                <h1>Dope</h1>
            </div>
<!--NEED ARTIST COVER PHOTO AND ARTWORK-->
            <div class="gallery-grid dope-gallery">
                <button class="gallery-item" type="button" aria-label="View Dope portfolio image">
                    <img src="../assets/dope/joker.png" alt="Joker tattoo artwork">
                </button>
               <button class="gallery-item" type="button" aria-label="View Dope portfolio image">
                    <img src="../assets/comingsoon.png" alt="Portfolio artwork">
                </button>
                <button class="gallery-item" type="button" aria-label="View Dope portfolio image">
                    <img src="../assets/comingsoon.png" alt="Portfolio artwork">
                </button>
                <button class="gallery-item" type="button" aria-label="View Dope portfolio image">
                    <img src="../assets/comingsoon.png" alt="Portfolio artwork">
                </button>
            </div>

        </section>
    </main>

    <dialog class="image-lightbox" id="imageLightbox" aria-label="Expanded portfolio image">
        <button class="lightbox-close" type="button" aria-label="Close image">&times;</button>
        <img class="lightbox-image" id="lightboxImage" alt="">
    </dialog>

    <script src="../JavaScript/gallery-lightbox.js"></script>
</body>
</html>
