    <main class="container gallery-main">
        <a class="btn btn-primary" href="index.html#features">Back to the Albums</a>
        <h1>Book Reviews</h1>
        <p class="section-subtitle">Fresh reads, honest thoughts, and the books worth sharing.</p>
        <div class="gallery-grid">
            <button class="gallery-item review-card" type="button" aria-label="Iron Flame">
                <img src="images/Reviews/IronFlame.jpg" alt="Iron Flame review photo">
                <div class="review-content">
                    <p class="review-rating">★★★★</p>
                    <h2>Iron Flame</h2>
                    <p class="review-blurb">A thrilling adventure with unforgettable characters.</p>
                    <p class="review-full" hidden>Review coming after I gather my thoughts
                     11/10/24-11/14/24

                     2nd Read
                     1/2/25-1/4/24
                     I guess I never gathered my thoughts after finishing. Well I wasn't planning on doing a reread before Onyx Storm comes out but I snagged a skip-the-line loan on Libby for the graphic audio and couldn't resist. So far my four star rating remains the same. The story picks up right where the cliffhanger of Fourth Wing ends. The plot is entertaining but Violet and her angsty "I can't trust him" is super annoying. I'm about halfway through part 1 so I'll come back and add more thoughts after I finish.

                     More thoughts after reading... I'm really glad I decided to reread because it got me super excited for Onyx Storm. The second half the of the book is almost non-stop action and that cliffhanger left me with no words....again.</p>
                </div>
            </button>
            <button class="gallery-item review-card" type="button" aria-label="View Book Lovers review">
                <img src="images/Reviews/husbandandlovers.jpg" alt="Husband and Lovers Review Photo">
                <div class="review-content">
                    <p class="review-rating">★★</p>
                    <h2>Husband & Lovers</h2>
                    <p class="review-blurb">A witty, heartfelt romance with a heroine you can't help rooting for.</p>
                    <p class="review-full" hidden>First of all, this book is proof that you should never judge a book by its cover because the content of this book definitely did not match the vibes of the cover. So make sure you read the synopsis before picking it up thinking it's probably a light and fun Summer read. Second of all, I'm an outsider here because I've seen so many great reviews but I personally just couldn't get into it. I don't mind books with two different timelines but since the two in this book didn't come together until the very end, it felt like I was reading two separate books. The past timeline in Egypt was interesting and I would have liked to have more of that story. The present timeline was really hard for me to relate with. Mallory was a really unlikeable character from the beginning. The fact that her sister was trying to do more to save her son was really irritating. While the reason why she didn't want to contact her son's father is *kind of* justified toward the end of the book, it wasn't enough to recover my feelings for her. When I don't care for a character it's hard for me to care about their story which is why I probably couldn't fully get into the book. With all that said, reviews are mostly favorable so definitely give it a try yourself.

                    Thank you to NetGalley and Random House Publishing Group - Ballantine for providing me a digital reviewer copy in exchange for my honest thoughts.</p>
                </div>
            </button>
            <button class="gallery-item review-card" type="button" aria-label="View The House in the Cerulean Sea review">
                <img src="images/Reviews/LostStory.jpg" alt="Lost Story review photo">
                <div class="review-content">
                    <p class="review-rating">★★</p>
                    <h2>Lost Story</h2>
                    <p class="review-blurb">Some stories are lost to time—until magic brings them home.</p>
                    <p class="review-full" hidden>It pains me to write this review because I LOVED this author's debut novel. But unfortunately I just didn't like this. I've seen a lot of people loving it so I'm thinking part of the problem may be I'm in an older demographic. Her last book felt a little YA to me but I still enjoyed it. But this one felt SUPER YA with immature dialogue and I just couldn't get over it. The characters are grown adults so I wasn't prepared for that. That said, the story itself was also lacking for me. The first 40% or so bored me to tears while they prepared to go on the journey to find Emilie's sister. After they leave it picks up but I was never really able to picture the magical world in my mind so I didn't enjoy the back half fully either. The characters also felt two-dimensional. Overall just disappointing but I'm happy to see others loving it. I do appear to be in the minority so definitely still give it a try, especially if you enjoyed The Wishing Game.

                    Thank you to NetGalley and Ballantine Books for providing me a digital reviewer copy in exchange for my honest thoughts. </p>
                </div>
            </button>
            <button class="gallery-item review-card" type="button" aria-label="Thursday Murder Club review">
                <img src="images/Reviews/MurderClub.jpg" alt="Thursday Murder Club review photo">
                <div class="review-content">
                    <p class="review-rating">★★★★★</p>
                    <h2>Thursday Murder Club</h2>
                    <p class="review-blurb">Four unlikely sleuths, one killer mystery, and retirement has never been so deadly.</p>
                    <p class="review-full" hidden>Have you ever read a book that made you feel like you were smiling the whole time you read it? That's how I felt with this book.

The Thursday Murder Club is made up of a group of members in a retirement community. They meet to discuss and try to solve old cold cases (one of the former members was a detective who kept copies of old case files.) When someone they know is suddenly killed, their detective skills are put into overdrive as they try and solve the case.

What I loved most about this book were the characters - mostly members of the club. I loved scenes when they're all together because their banter was so entertaining. It's a multiple POV book and we get Joyce's (former nurse who is new to the group) through journal entries which I thought was different and fun.

I went in semi-blind and enjoyed it that way so I won't go further into the characters or mystery plot.

Read if you enjoy:
❤️ short chapters
🖤 bingeable books
❤️ multiple POV
🖤 witty and sarcastic humor
❤️ books set in England</p>
                </div>
            </button>
