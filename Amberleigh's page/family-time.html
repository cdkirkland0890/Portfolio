<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Time! | A.MillionBooks</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="gallery-page">
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">A.MillionBooks</a>
        </div>
    </header>

    <main class="container gallery-main">
        <a class="btn btn-primary" href="index.html#features">Back to the Albums</a>
        <h1>Family Time!</h1>
        <p class="section-subtitle">The sweet moments, adventures, and memories that matter most.</p>
        <div class="gallery-grid">
            <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/family1.jpg" alt="Ironman">
            </button>
            <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/family2.jpg" alt="Eaglet">
            </button>
            <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/family3.jpg" alt="Crafts">
            </button>
            <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/family4.jpg" alt="Movie Date">
            </button>
        </div>
    </main>

    <dialog class="image-lightbox" id="imageLightbox" aria-label="Expanded photo">
        <button class="lightbox-close" type="button" aria-label="Close expanded photo">&times;</button>
        <img class="lightbox-image" id="lightboxImage" alt="">
    </dialog>

    <script src="JavaScript/gallery.js"></script>
</body>
</html>
