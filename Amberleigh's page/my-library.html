<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library! | A.MillionBooks</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="gallery-page">
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">A.MillionBooks</a>
        </div>
    </header>

    <main class="container gallery-main">
        <a class="btn btn-primary" href="index.html#features">Back To Albums</a>
        <h1>My Library!</h1>
        <p class="section-subtitle">A look at the books, stacks, and cozy reading moments I love.</p>
        <div class="gallery-grid">
            <button class="gallery-item" type="button" aria-label="View my library photo">
                <img src="images/Library1.jpg" alt="Library 1">
            </button>
            <button class="gallery-item" type="button" aria-label="View my library photo">
                <img src="images/Library2.jpg" alt="Books and Roses">
            </button>
            <button class="gallery-item" type="button" aria-label="View my library photo">
                <img src="images/Library3.jpeg" alt="Halloween Books">
            </button>
        </div>
    </main>

    <dialog class="image-lightbox" id="imageLightbox" aria-label="Expanded photo">
        <button class="lightbox-close" type="button" aria-label="Close expanded photo">&times;</button>
        <img class="lightbox-image" id="lightboxImage" alt="">
    </dialog>

    <script src="JavaScript/gallery.js"></script>
</body>
</html>
