<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift Treasures | A.MillionBooks</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="gallery-page">
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">A.MillionBooks</a>
        </div>
    </header>

    <main class="container gallery-main">
        <a class="btn btn-primary" href="index.html#features">Back to Albums</a>
        <h1>Thrift Treasures</h1>
        <p class="section-subtitle">Discover hidden gems and unique finds from thrift stores.</p>
        <div class="gallery-grid">
            <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/Thrift/comingsoon.png" alt="Coming Soon">
            </button>
             <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/Thrift/comingsoon.png" alt="Coming Soon">
            </button>
            <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/Thrift/comingsoon.png" alt="Coming Soon">
            </button>
             <button class="gallery-item" type="button" aria-label="View family time photo">
                <img src="images/Thrift/comingsoon.png" alt="Coming Soon">
            </button>
        </div>
    </main>

    <dialog class="image-lightbox" id="imageLightbox" aria-label="Expanded photo">
        <button class="lightbox-close" type="button" aria-label="Close expanded photo">&times;</button>
        <img class="lightbox-image" id="lightboxImage" alt="">
    </dialog>

    <script src="JavaScript/gallery.js"></script>
</body>
</html>
